name: CI/CD

on:
  push:
    branches: [main, dev, 'feature/**', 'features/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/elmtarkati/portfolio

# A new commit replaces an older run on the same branch.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Check the application on every branch and pull request.
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  # 2. Publish only from main, after the checks pass.
  publish:
    name: Publish Docker image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the production image
        run: docker build --target production -t "${IMAGE}:latest" -t "${IMAGE}:${GITHUB_SHA}" .
      - name: Push both image tags
        run: docker push --all-tags "$IMAGE"

  # 3. Deploy after publication, only when the owner enables it.
  deploy:
    name: Deploy to Render
    needs: publish
    if: vars.ENABLE_RENDER_DEPLOY == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Request Render deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --max-time 60 --output /dev/null \
            --get --data-urlencode "imgURL=${IMAGE}:${GITHUB_SHA}" "$DEPLOY_HOOK"
