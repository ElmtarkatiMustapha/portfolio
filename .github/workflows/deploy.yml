name: Deploy to Render
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  deploy:
    # Disabled until the owner explicitly enables deployments later.
    if: >-
      vars.ENABLE_RENDER_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the image published by successful CI
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: docker.io/elmtarkati/portfolio
        shell: bash
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Configure the RENDER_DEPLOY_HOOK_URL secret before enabling deployment."
            exit 1
          fi
          case "$DEPLOY_HOOK" in
            https://api.render.com/deploy/*) ;;
            *) echo "Expected a Render deploy hook URL."; exit 1 ;;
          esac
          image_url="${IMAGE}:${COMMIT_SHA}"
          curl --fail --silent --show-error --output /dev/null --max-time 60 \
            --get --data-urlencode "imgURL=${image_url}" "$DEPLOY_HOOK"
          echo "Render accepted a deployment request for ${image_url}. Check Render for build and live status."
